# dev/config/detection.yaml

experiment_name: "baseline_densenet_patch"
output_dir: "dev/runs/"
data:
  processed_dir: "dev/data/processed/kits23/"
  batch_size: 32
  num_workers: 4
  patch_size: [224, 224]
  split_seed: 42
  train_frac: 0.8
  augment: true

model:
  arch: "densenet121"
  pretrained: false
  num_classes: 2

train:
  epochs: 100
  optimizer: "adam"
  lr: 0.0005
  weight_decay: 0.0001
  scheduler: "step"
  scheduler_step_size: 40
  scheduler_gamma: 0.5

loss:
  name: "bce"
  pos_weight: 1.0

misc:
  seed: 42
  testing: false  # set to true for short test runs
  save_interval: 10  # save checkpoint every N epochs (optional)
