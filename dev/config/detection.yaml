# dev/config/detection.yaml

experiment_name: "baseline_densenet_patch"
output_dir: "dev/runs/"
data:
  processed_dir: "dev/data/processed/kits23/"
  batch_size: 16
  num_workers: 4
  patch_size: [224, 224]
  split_seed: 123
  train_frac: 0.8
  augment: true

model:
  arch: "densenet121"
  pretrained: false
  num_classes: 2

train:
  epochs: 200
  optimizer: "adam"
  scheduler: "cyclic"
  base_lr: 0.0001
  max_lr: 0.001
  step_size_up: 600 
  lr: 0.0003
  weight_decay: 0.0001
  scheduler_step_size: 40
  scheduler_gamma: 0.5

loss:
  name: "bce"
  pos_weight: 1.6

misc:
  seed: 123
  testing: false  # set to true for short test runs
  save_interval: 10  # save checkpoint every N epochs (optional)
